    note: "New in this release; ported onto 4.0.6; fixed at 4.0.6.1-backpatch-00001 (backpatch-camel@434948ac3438..30d537d13a14). The cxf and cxfrs producers select the operation from the headers `CamelCxfOperationName` and `CamelCxfOperationNamespace`, the new values of `CxfConstants.OPERATION_NAME` and `CxfConstants.OPERATION_NAMESPACE`, and no longer read `operationName` or `operationNamespace`; the consumers set the new names too. If your application sets or reads these headers by their former literal names, or was compiled against the earlier `CxfConstants`, whose values the compiler copies into your classes, the former headers no longer select the operation: a cxf producer logs a WARN once and invokes the `defaultOperationName` operation or the first operation CXF returns, and a cxfrs producer with the proxy client API fails with a `NoSuchMethodException` that names `CamelCxfOperationName`. Use the new names or the constants and recompile; a cxfrs simple binding route that dispatches on `${header.operationName}` must use `${header.CamelCxfOperationName}`, and the endpoint DSL header methods `operationName()` and `operationNamespace()` are now `cxfOperationName()` and `cxfOperationNamespace()`. The former names are filtered and not sent to the service. This release does not include upstream's camel-jms change that drops inbound Camel headers (CAMEL-21221): a JMS message that carries a `CamelCxfOperationName` property can still select the operation of a route from a `jms:` endpoint to a `cxf:` endpoint."
